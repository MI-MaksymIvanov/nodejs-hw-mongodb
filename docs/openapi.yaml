openapi: 3.1.0

info:
  version: 1.0.0
  title: MI-Contacts APP
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: This is documantation of MI-Cotacts APP

tags:
  - name: Contacts
    description: Operation with contscts

servers:
  - url: http://localhost:3000

paths:
  /contacts/{contactId}:
    get:
      $ref: '../swagger/paths/contacts/{contactId}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{contactId}/patch.yaml'

    delete:
      $ref: '../swagger/paths/contacts/{contactId}/delete.yaml'
  /contacts:
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
    get:
      $ref: '../swagger/paths/contacts/get.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
